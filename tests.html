<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тесты расчётов</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:16px;background:#f6f7f9;color:#15181d}
.ok{color:#16a34a}.fail{color:#dc2626;font-weight:700}
pre{white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<h1 id="sum">…</h1>
<pre id="log"></pre>
<script src="calc.js"></script>
<script src="quotes.js"></script>
<script>
"use strict";
const results = [];
function eq(name, got, want){
  const pass = JSON.stringify(got) === JSON.stringify(want);
  results.push({ name, pass, got, want });
}
function near(name, got, want){ eq(name, Math.round(got * 100) / 100, want); }

/* fixture: real October 2026 rows from 💸 Expenses (static rows come from the automation, no Date) */
const S = (desc, cat, plan, price) => ({ kind:"exp", type:"Static", desc, cat, plan, price, date:null, month:"2026-10" });
const D = (desc, cat, price, date) => ({ kind:"exp", type:"Dynamic", desc, cat, price, date, month:date.slice(0,7) });
const oct = [
  S("Daily ehson","Charity 🌟",2000000,2085000),
  S("Nafaqa","Home 🏡",1000000,1000000),
  S("Fuel","Car 🏎️",1500000,760000),
  S("Haircut","Personal 👤",200000,50000),
  S("Uyga bozorlik","Home 🏡",3000000,1500000),
  S("Uztelecom","Monthly payment 🔂",350000,undefined),
  S("Evos + snacks","Entertainment 🎉",1500000,236000),
  D("Passport + ID",null,857000,"2026-10-05"),
  D("Oftalmolog","Healthcare 💊",682000,"2026-10-05"),
  D("Ko'ylak","Gifts 🎁",500000,"2026-10-05"),
  D("Fitbit","Gifts 🎁",400000,"2026-10-05"),
  { kind:"exp", type:null, desc:"Pills", cat:"Healthcare 💊", price:124000, date:"2026-10-05", month:"2026-10" },
  { kind:"exp", type:null, desc:"Umarga yostiq", cat:null, price:277000, date:"2026-10-05", month:"2026-10" },
  { kind:"exp", type:null, desc:"Umar gimnastika", cat:null, price:400000, date:"2026-10-05", month:"2026-10" }
];

/* --- staticSummary --- */
const s = Calc.staticSummary(oct, "2026-10");
eq("plan = Σ Static", s.plan, 9550000);
eq("fact = Σ Price of planned static rows only", s.fact, 5631000);
eq("diff = fact − plan", s.diff, -3919000);
near("pct = diff / plan × 100", s.pct, -41.04);
eq("status ok", s.status, "ok");
eq("rows without fact counted", s.withoutFact, 1);
eq("dynamic rows not mixed in", s.items.length, 7);

const over = Calc.staticSummary([S("A","x",5000000,5300000)], "2026-10");
eq("over plan: +300 000", over.diff, 300000);
near("over plan: +6%", over.pct, 6);
const under = Calc.staticSummary([S("A","x",5000000,4700000)], "2026-10");
eq("under plan: −300 000", under.diff, -300000);
near("under plan: −6%", under.pct, -6);

const empty = Calc.staticSummary(oct, "2026-11");
eq("no static rows → empty", empty.status, "empty");
eq("empty → pct null", empty.pct, null);
const noplan = Calc.staticSummary([S("A","x",0,100000)], "2026-10");
eq("static rows without plan → noplan", noplan.status, "noplan");
eq("noplan → pct null (no division by 0)", noplan.pct, null);
eq("unplanned static sum reported separately", noplan.unplannedSum, 100000);
const mixed = Calc.staticSummary([S("A","x",1000,1200), S("B","y",0,500)], "2026-10");
eq("unplanned static excluded from fact", mixed.fact, 1200);
eq("unplanned static listed", mixed.unplanned.length, 1);

/* --- totals & change --- */
const recs = oct.concat([
  { kind:"inc", cat:"Salary 💳", price:30000000, date:"2026-10-01", month:"2026-10" },
  { kind:"inc", cat:"Salary 💳", price:25000000, date:"2026-09-30", month:"2026-09" },
  { kind:"exp", cat:"Home 🏡", price:10000000, date:"2026-09-12", month:"2026-09" },
  { kind:"exp", cat:"Home 🏡", price:999, date:null, month:null }
]);
const t = Calc.totals(recs, "2026-10");
eq("October expenses", t.exp, 8871000);
eq("October incomes", t.inc, 30000000);
eq("October net", t.net, 21129000);
const p = Calc.totals(recs, "2026-09");
eq("September totals", p, { inc:25000000, exp:10000000, net:15000000 });
const ch = Calc.change(t.exp, p.exp);
eq("change abs", ch.abs, -1129000);
near("change pct", ch.pct, -11.29);
eq("change from 0 → pct null", Calc.change(5, 0).pct, null);
eq("undated records excluded from totals", Calc.totals(recs, null).exp, 999);

/* --- history --- */
const h = Calc.history(recs, "2026-10", 3);
eq("history keys", h.map(x => x.key), ["2026-08","2026-09","2026-10"]);
eq("history empty month = 0", h[0].exp, 0);

/* --- byCategory --- */
const bc = Calc.byCategory(recs, "2026-10", "exp");
eq("category total = month expenses", bc.total, 8871000);
eq("categories sorted by sum", bc.groups[0].name, "Home 🏡");
eq("Home sum", bc.groups[0].sum, 2500000);
near("Home share", bc.groups[0].share, 28.18);
near("shares add up to 100", bc.groups.reduce((a, g) => a + g.share, 0), 100);
eq("missing category grouped", bc.groups.some(g => g.name === Calc.NO_CAT), true);
eq("zero-sum category hidden", bc.groups.some(g => g.name === "Monthly payment 🔂"), false);
eq("income categories", Calc.byCategory(recs, "2026-10", "inc").groups.map(g => [g.name, g.sum]), [["Salary 💳", 30000000]]);

/* --- investing (real 📈 Investing rows, Oct 2026) --- */
const I = (cat, type, invested, profit) => ({ cat, type, invested, profit });
const inv = [
  I("Iman Invest","Invested",12950000), I("Iman Invest","Profit",0,187723), I("Iman Invest","Invested",6500000),
  I("Iman Invest","Profit",0,151455), I("Iman Invest","Invested",3900000), I("Iman Invest","Profit",0,215507),
  I("Iman Invest","Profit",0,431292), I("Iman Invest","Profit",0,475651), I("Iman Invest","Profit",0,413945),
  I("Iman Invest","Profit",0,421119), I("Iman Invest","Invested",4493656), I("Iman Invest","Invested",1000000),
  I("Gold","Gifted",-20000000), I("Iman Invest",null,0,428291), I("Iman Invest","Invested",5000000),
  I("Gold","Invested",17922000), I("Iman Invest","Invested",10000000), I("Iman Invest","Invested",6000000),
  I("Iman Invest","Gifted",-15000000)
].concat(Array.from({ length: 8 }, () => I("Iman Invest","Invested",10000000)));
const is = Calc.investSummary(inv);
eq("invest net = Σ Invested.S (Airtable sum)", is.net, 112765656);
eq("invest profit = Σ Profit (Airtable sum)", is.profit, 2724983);
eq("invest total = Σ Total (Airtable sum)", is.total, 115490639);
eq("gifted counted as withdrawn", is.withdrawn, 35000000);
eq("deposited = net + withdrawn", is.deposited, 147765656);
near("roi = profit / deposited", is.roi, 1.84);
eq("by category sorted by total", is.byCat.map(c => c.name), ["Iman Invest","Gold"]);
eq("gold net", is.byCat[1].total, -2078000);
eq("empty ledger roi null", Calc.investSummary([]).roi, null);

/* --- goals --- */
eq("no goal set", Calc.goalProgress(0, 5000000).status, "nogoal");
eq("goal left", Calc.goalProgress(150000000, 115490639).left, 34509361);
near("goal pct", Calc.goalProgress(150000000, 115490639).pct, 76.99);
eq("goal reached", Calc.goalProgress(100, 120), { status:"done", target:100, saved:120, left:0, pct:100 });

/* --- groupSum --- */
const gs = Calc.groupSum([{ cat:"A", amount:300 }, { cat:"B", amount:100 }, { cat:"A", amount:100 }, { cat:null, amount:0 }]);
eq("groupSum totals", gs.groups.map(g => [g.name, g.sum, g.share]), [["A",400,80],["B",100,20]]);

/* --- sun theme (Tashkent 41.31, 69.28; UTC+5). Expected times worked out by hand from
   declination + equation of time (sunrise equation, refraction −0.833°) --- */
const TAS = [41.3111, 69.2797];
const st = Calc.sunTimes(new Date("2026-10-22T07:00:00Z"), ...TAS);
const hm = d => new Date(d.valueOf() + 5 * 3600000).toISOString().slice(11, 16);   // local time in Tashkent
const minutesOff = (d, want) => { const [h, m] = want.split(":").map(Number); const [h2, m2] = hm(d).split(":").map(Number); return Math.abs(h * 60 + m - h2 * 60 - m2); };
eq("Tashkent sunrise 22 Oct ≈ 06:43 (±5 min)", minutesOff(st.sunrise, "06:43") <= 5, true);
eq("Tashkent sunset 22 Oct ≈ 17:31 (±5 min)", minutesOff(st.sunset, "17:31") <= 5, true);
const sj = Calc.sunTimes(new Date("2026-06-21T07:00:00Z"), ...TAS);
eq("Tashkent sunrise 21 Jun ≈ 04:50 (±5 min)", minutesOff(sj.sunrise, "04:50") <= 5, true);
eq("Tashkent sunset 21 Jun ≈ 19:59 (±5 min)", minutesOff(sj.sunset, "19:59") <= 5, true);
eq("noon is light", Calc.sunTheme(new Date("2026-10-22T07:00:00Z"), ...TAS).theme, "light");
eq("23:00 is dark", Calc.sunTheme(new Date("2026-10-22T18:00:00Z"), ...TAS).theme, "dark");
eq("05:00 is dark", Calc.sunTheme(new Date("2026-10-22T00:00:00Z"), ...TAS).theme, "dark");
const night = Calc.sunTheme(new Date("2026-10-22T18:00:00Z"), ...TAS);
eq("after sunset next flip = tomorrow's sunrise", hm(night.next) < "07:10" && night.next > new Date("2026-10-23T00:00:00Z"), true);
eq("before sunrise next flip = today's sunrise", Calc.sunTheme(new Date("2026-10-22T00:00:00Z"), ...TAS).next.valueOf(), st.sunrise.valueOf());
eq("polar night handled", Calc.sunTheme(new Date("2026-12-21T12:00:00Z"), 78.2, 15.6).theme, "dark");

/* --- module quotes: real Airtable table names (with emoji) → source --- */
const qsrc = n => (Quotes.quoteFor(n) || {}).src || null;
eq("Expenses quote", qsrc("💸 Expenses"), "Коран, 17:26");
eq("Incomes quote", qsrc("💵 Incomes"), "Коран, 4:29");
eq("Monthly report quote", qsrc("🗓️ Monthly report"), "Коран, 17:29");
eq("Annually report quote", qsrc("🌏 Annually report"), "Коран, 59:18");
eq("Debt tracker quote", qsrc("👤 Debt tracker"), "Коран, 2:282");
eq("Investing quote", Quotes.quoteFor("📈 Investing").text, "…только путём торговли по обоюдному согласию");
eq("Investing goals → hadith, not the Investing quote", qsrc("📈 Investing goals"), "Сахих аль-Бухари, хадис 1");
eq("Zakot quote", qsrc("💰 Zakot"), "Коран, 9:103");
eq("Networth quote", qsrc("💎 Networth"), "Коран, 18:46");
eq("Net worth spelled apart", qsrc("Net worth"), "Коран, 18:46");
eq("Networking is not Networth", qsrc("👤 Networking"), null);
eq("tables without a quote", [qsrc("🛐 Kafforatlar"), qsrc("Meros taqsimoti (Onam)")], [null, null]);
eq("9 quotes, none duplicated", new Set(Quotes.QUOTES.map(q => q.text)).size, 9);

/* --- month helpers --- */
eq("shift back over year", Calc.shiftMonth("2026-01", -1), "2025-12");
eq("shift forward over year", Calc.shiftMonth("2026-12", 1), "2027-01");
eq("month from Date", Calc.monthKeyOf({ date:"2026-10-05" }), "2026-10");
eq("month from links", Calc.monthKeyOf({ monthName:"October", year:"2026" }), "2026-10");
eq("month link with emoji", Calc.monthKeyOf({ monthName:"🗓️ October", year:"2026" }), "2026-10");
eq("month link, year from createdTime", Calc.monthKeyOf({ monthName:"October", createdTime:"2026-10-01T01:00:00.000Z" }), "2026-10");
eq("fallback createdTime", Calc.monthKeyOf({ createdTime:"2026-10-01T01:00:00.000Z" }), "2026-10");
eq("no data → null", Calc.monthKeyOf({}), null);

/* --- formatting --- */
eq("fmtUZS", Calc.fmtUZS(5300000), "5 300 000 сум");
eq("fmtSigned +", Calc.fmtSigned(300000), "+300 000 сум");
eq("fmtSigned −", Calc.fmtSigned(-300000), "−300 000 сум");
eq("fmtShort mln", Calc.fmtShort(9550000), "9,55 млн");
eq("fmtShort round mln", Calc.fmtShort(5000000), "5 млн");
eq("fmtShort thousands", Calc.fmtShort(-300000), "−300 тыс");
eq("fmtPct", Calc.fmtPct(6), "+6%");
eq("fmtPct null", Calc.fmtPct(null), "—");

const failed = results.filter(r => !r.pass);
document.getElementById("sum").innerHTML = failed.length
  ? '<span class="fail">' + failed.length + " из " + results.length + " не прошли</span>"
  : '<span class="ok">Все ' + results.length + " тестов прошли ✓</span>";
document.getElementById("log").innerHTML = results.map(r => r.pass
  ? '<span class="ok">✓</span> ' + r.name
  : '<span class="fail">✗ ' + r.name + "\n   получено: " + JSON.stringify(r.got) + "\n   ожидалось: " + JSON.stringify(r.want) + "</span>"
).join("\n");
window.TEST_RESULT = { total: results.length, failed: failed.map(r => r.name) };
</script>
</body>
</html>
